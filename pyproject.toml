[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netswitch"
version = "0.1.0"
description = "Per-application network selection for Linux, with a desktop app and agent-friendly CLI"
requires-python = ">=3.11"

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]

[project.scripts]
netswitch = "netswitch.cli:main"

[tool.setuptools.packages.find]
include = ["netswitch*"]

[tool.setuptools.package-data]
netswitch = ["assets/*.svg", "assets/*.png"]
